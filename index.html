<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="author" content="Anant Shukla" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OPTIC EVAL</title>
<style>
  :root { --paper:#f4f6f9; --card:#fff; --ink:#1c2230; --muted:#5d6779; --line:#d9dee7; --form:#d63a58; --ok:#1f7a56; --warn-bg:#fff6dc; --warn:#7a5800; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper:#12151c; --card:#1b2029; --ink:#eef1f6; --muted:#9aa4b6; --line:#2e3544; --form:#ff6b86; --ok:#5ad0a0; --warn-bg:#3a3217; --warn:#f2d27a; }
  }
  * { box-sizing:border-box; }
  html { height:100%; }
  body { margin:0; min-height:100%; background:var(--paper); color:var(--ink);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; line-height:1.5; -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top,0px) 0 0; }
  [hidden] { display:none !important; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 18px 0; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; }
  .mark { width:26px; height:26px; border:3px solid var(--ink); border-radius:50%; position:relative; flex:none; }
  .mark::after { content:""; position:absolute; inset:4px; border-radius:50%; background:var(--form); }
  h1 { font-size:clamp(2rem,8vw,2.9rem); line-height:1.08; margin:40px 0 12px; font-weight:800; letter-spacing:-.02em; }
  h2 { font-size:1.5rem; line-height:1.2; margin:6px 0 6px; font-weight:800; }
  .lead { color:var(--muted); margin:0 0 24px; max-width:36ch; }
  :focus-visible { outline:3px solid var(--form); outline-offset:2px; }

  .btn { display:flex; align-items:center; justify-content:center; width:100%; min-height:56px; border-radius:14px; border:2px solid var(--ink);
    font:inherit; font-weight:800; font-size:1.05rem; cursor:pointer; background:var(--ink); color:var(--paper); }
  .btn:active { transform:translateY(1px); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.ghost { background:transparent; color:var(--ink); }
  .btn.small { min-height:42px; width:auto; padding:0 14px; font-size:.9rem; font-weight:700; }

  /* progress */
  .prog { display:flex; align-items:center; gap:8px; margin:22px 0 4px; }
  .dot { width:30px; height:30px; border-radius:50%; border:2px solid var(--ink); display:grid; place-items:center; font-weight:800; font-size:.85rem; flex:none; }
  .dot.done { background:var(--ink); color:var(--paper); }
  .dot.now { background:var(--form); border-color:var(--form); color:#fff; }
  .line { height:2px; flex:1; background:var(--line); }
  .kicker { color:var(--muted); font-size:.85rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-top:14px; }

  .card { background:var(--card); border:2px solid var(--ink); border-radius:14px; padding:16px; margin-top:16px; }
  label { display:block; font-weight:700; font-size:.9rem; margin:14px 0 6px; }
  .card > label:first-child { margin-top:0; }
  input, select, textarea { width:100%; min-height:50px; padding:10px 14px; font:inherit; color:var(--ink); background:var(--paper); border:2px solid var(--line); border-radius:12px; }
  input:focus, select:focus, textarea:focus { border-color:var(--ink); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid2 label { margin-top:0; }
  .hint { color:var(--muted); font-size:.88rem; margin:8px 0 0; }
  .err { color:var(--form); font-weight:700; min-height:1.4em; margin:12px 0 0; }
  .notice { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 14px; font-weight:600; font-size:.92rem; margin-top:12px; }

  .opt { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; background:var(--card); color:var(--ink); border:2px solid var(--line);
    border-radius:14px; padding:14px; margin-top:12px; font:inherit; cursor:pointer; }
  .opt[aria-checked="true"] { border-color:var(--ink); }
  .radio { flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--ink); margin-top:2px; position:relative; }
  .opt[aria-checked="true"] .radio::after { content:""; position:absolute; inset:4px; border-radius:50%; background:var(--form); }
  .opt b { display:block; } .opt span.d { color:var(--muted); font-size:.9rem; }
  .preview { margin-top:16px; border:1px solid var(--line); border-radius:12px; padding:10px; background:var(--paper); }
  .preview svg { width:100%; height:auto; display:block; color:var(--ink); }

  .krow { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line); }
  .krow:last-child { border-bottom:0; }
  .qn { width:34px; font-weight:800; flex:none; font-variant-numeric:tabular-nums; }
  .bub { flex:1; max-width:56px; min-width:40px; height:44px; border-radius:50%; border:2px solid var(--ink); background:transparent; color:var(--ink); font:inherit; font-weight:800; cursor:pointer; }
  .bub.on { background:var(--form); border-color:var(--form); color:#fff; }
  .count { display:inline-block; font-weight:800; padding:4px 12px; border-radius:20px; border:2px solid var(--line); }
  .count.full { color:var(--ok); border-color:var(--ok); }
  .tools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }

  dl { margin:0; } dt { color:var(--muted); font-size:.85rem; font-weight:700; margin-top:12px; } dd { margin:2px 0 0; font-weight:700; overflow-wrap:anywhere; }
  .keystr { font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:.08em; }

  .bar { position:sticky; bottom:0; margin:22px -18px 0; padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--paper); border-top:1px solid var(--line); display:flex; gap:12px; }
  .bar .btn { flex:1; }
  .bar .btn.ghost { flex:0 0 32%; }
  .done-tick { width:64px; height:64px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center; font-size:2rem; font-weight:800; margin:40px 0 8px; }

  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .kpi { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:10px 12px; }
  .kpi small { color:var(--muted); font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; display:block; }
  .kpi b { font-size:1.35rem; display:block; line-height:1.2; } .kpi span { color:var(--muted); font-size:.8rem; overflow-wrap:anywhere; }
  .vcs { display:flex; flex-wrap:wrap; gap:8px; }
  .vc { min-height:44px; padding:0 16px; border-radius:22px; border:2px solid var(--ink); background:transparent; color:var(--ink); font:inherit; font-weight:800; cursor:pointer; }
  .vc.on { background:var(--ink); color:var(--paper); }
  .rsec { margin-top:18px; } .rsh { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:0 2px 6px; } .rsh span { color:var(--muted); font-size:.85rem; }
  .rrow { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; overflow:hidden; } .rrow.open { border:2px solid var(--ink); }
  .rhead { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:transparent; border:0; color:var(--ink); font:inherit; padding:12px; cursor:pointer; min-height:64px; }
  .rk { flex:none; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:800; border:2px solid var(--line); }
  .rk.r1 { background:#f5c542; border-color:#c99a12; color:#2b2100; } .rk.r2 { background:#d7dde6; border-color:#98a2b3; color:#1c2230; } .rk.r3 { background:#e8b48a; border-color:#b97a45; color:#2b1700; }
  .rn { flex:1; min-width:0; } .rn b { display:block; overflow-wrap:anywhere; } .rn small { color:var(--muted); }
  .rsc { text-align:right; flex:none; } .rsc b { font-size:1.2rem; } .rsc small { display:block; color:var(--muted); }
  .rdet { padding:0 12px 14px; border-top:1px dashed var(--line); } .rdet .stats { margin-top:12px; } .rdet .chips { margin-top:10px; }
  .chip.blank { border-color:var(--muted); } .chip.multi { border-color:#8b3fd1; }
  .rdet .btn { margin-top:12px; }
  .pad { height:40px; }
  .ghead { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .sw { flex:none; width:56px; height:32px; border-radius:16px; border:2px solid var(--ink); background:var(--paper); position:relative; cursor:pointer; padding:0; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--ink); transition:left .15s; }
  .sw.on { background:var(--form); border-color:var(--form); } .sw.on::after { left:27px; background:#fff; }
  .chipbox { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .gchip { display:inline-flex; align-items:center; gap:2px; padding:2px 2px 2px 12px; border:2px solid var(--ink); border-radius:20px; font-weight:700; }
  .gchip button { width:30px; height:30px; border-radius:50%; border:0; background:transparent; color:var(--form); font-size:1rem; cursor:pointer; }
  .gpb { min-width:48px; min-height:44px; padding:0 14px; border-radius:22px; border:2px solid var(--ink); background:transparent; color:var(--ink); font:inherit; font-weight:800; cursor:pointer; }
  .gpb.on { background:var(--form); border-color:var(--form); color:#fff; }
  #gp-box .qo { gap:8px; flex-wrap:wrap; margin-top:4px; }
  .linkbtn { background:none; border:0; color:var(--form); font:inherit; font-weight:700; cursor:pointer; padding:10px 0 0; }
  #vf { position:fixed; inset:0; background:#000; z-index:40; overflow:hidden; }
  #vf video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #vf-frame { position:absolute; border:2px dashed #22d3ee; box-shadow:0 0 0 9999px rgba(0,0,0,.45); }
  .br { position:absolute; width:30px; height:30px; border:0 solid #facc15; }
  .br.tl { top:-3px; left:-3px; border-top-width:5px; border-left-width:5px; } .br.tr { top:-3px; right:-3px; border-top-width:5px; border-right-width:5px; }
  .br.bl { bottom:-3px; left:-3px; border-bottom-width:5px; border-left-width:5px; } .br.brr { bottom:-3px; right:-3px; border-bottom-width:5px; border-right-width:5px; }
  .vz { position:absolute; border:1.5px solid rgba(94,234,212,.85); border-radius:6px; background:rgba(0,25,30,.15); }
  .vz span { position:absolute; top:2px; left:6px; font-size:10px; font-weight:700; color:#5eead4; letter-spacing:.04em; text-shadow:0 0 3px #000; }
  .vtag { position:absolute; top:-13px; left:50%; transform:translateX(-50%); background:#22d3ee; color:#00252b; font-size:10px; font-weight:800; padding:2px 10px; border-radius:20px; white-space:nowrap; }
  #vf.guide { background:radial-gradient(circle at 50% 40%, #1f2937, #000); }
  .vf-top { position:absolute; top:0; left:0; right:0; padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px; display:flex; gap:10px; align-items:flex-start; color:#fff; font-weight:600; font-size:.9rem; background:linear-gradient(#000a,#0000); }
  .vf-top span { flex:1; } .vf-top button { flex:none; width:44px; height:44px; border-radius:50%; border:2px solid #fff; background:#0008; color:#fff; font-size:1.2rem; cursor:pointer; }
  .vf-bot { position:absolute; left:0; right:0; bottom:0; padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px)); display:flex; gap:12px; background:linear-gradient(#0000,#000b); }
  .vf-bot .btn { margin:0; } .vf-bot .btn.ghost { color:#fff; border-color:#fff; flex:0 0 40%; } .vf-bot .btn:not(.ghost) { background:#facc15; border-color:#facc15; color:#1c1500; }
  .foot { text-align:center; color:var(--muted); font-size:.85rem; padding:22px 0 calc(22px + env(safe-area-inset-bottom,0px)); }
  .preview svg, .preview img { background:#fff; color:#000; border-radius:4px; }
  .qpad { position:sticky; top:0; z-index:5; background:var(--card); border:2px solid var(--ink); border-radius:14px; padding:12px; margin-top:12px; }
  .qtop { display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:700; }
  .qtop b { font-size:1.6rem; }
  .qbtns { display:grid; grid-template-columns:repeat(var(--n,4),1fr); gap:10px; margin-top:10px; }
  .qb { min-height:60px; border-radius:14px; border:2px solid var(--ink); background:transparent; color:var(--ink); font:inherit; font-weight:800; font-size:1.5rem; cursor:pointer; }
  .qb.on { background:var(--form); border-color:var(--form); color:#fff; }
  .qb:active { transform:translateY(1px); }
  .qnav { display:flex; gap:10px; margin-top:10px; } .qnav .btn { flex:1; }
  .krow.cur { background:color-mix(in srgb, var(--form) 12%, transparent); border-radius:10px; }
  .fillbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; font-weight:700; font-size:.9rem; }
  .fillbar .btn.small { min-width:44px; padding:0 12px; }
  .ex { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .ex strong { display:block; overflow-wrap:anywhere; } .ex small { color:var(--muted); }
  .exa { display:flex; flex-direction:column; gap:8px; flex:none; }
  .empty { border:2px dashed var(--line); border-radius:12px; padding:18px; color:var(--muted); }
  #toast { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); max-width:calc(100% - 36px);
    background:var(--ink); color:var(--paper); padding:12px 16px; border-radius:12px; font-weight:600; font-size:.95rem; z-index:30; }
  .shot { width:100%; height:auto; display:block; border:2px solid var(--ink); border-radius:12px; background:#fff; margin-top:12px; }
  #al { touch-action:none; }
  .pick { display:grid; gap:10px; margin-top:12px; }
  .tips { color:var(--muted); font-size:.9rem; padding-left:18px; margin:14px 0 0; }
  .strip { width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:8px; background:#fff; margin-bottom:6px; }
  .rv { display:flex; flex-direction:column; gap:8px; padding:12px 0; border-bottom:1px dashed var(--line); }
  .rv:last-child { border-bottom:0; }
  .rv small { color:var(--muted); margin-left:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { min-width:46px; min-height:46px; padding:0 10px; border-radius:12px; border:2px solid var(--ink); background:transparent; color:var(--ink); font:inherit; font-weight:800; cursor:pointer; }
  .chip.on { background:var(--form); border-color:var(--form); color:#fff; }
  .chip.hint { border-style:dashed; border-color:var(--form); }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 4px; text-align:center; }
  .stat b { display:block; font-size:1.4rem; } .stat small { color:var(--muted); font-size:.75rem; font-weight:700; }
  .hero { background:var(--ink); color:var(--paper); border-radius:14px; padding:16px; margin-top:12px; }
  .hero small { opacity:.75; } .hero .big { font-size:2.4rem; font-weight:800; line-height:1.1; margin-top:6px; }
  .bd { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:6px; margin-top:12px; }
  .bd div { border:1px solid var(--line); border-radius:10px; padding:6px 8px; font-size:.82rem; background:var(--card); }
  .bd .ok { border-color:var(--ok); } .bd .no { border-color:var(--form); }
  details { margin-top:14px; } summary { font-weight:700; cursor:pointer; min-height:44px; display:flex; align-items:center; }
  input[type=range] { min-height:32px; padding:0; border:0; background:transparent; accent-color:var(--form); }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:.8rem; color:var(--muted); margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
  #sc-step canvas[hidden] { display:none; }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><div class="mark" aria-hidden="true"></div>OPTIC EVAL</div>

  <!-- Welcome -->
  <section id="s-welcome">
    <h1>Welcome User!</h1>
    <p class="lead">Create an examination to start checking OMR answer sheets.</p>
    <button class="btn" id="btn-create" type="button">Create examination</button>
    <h2 style="margin-top:34px">Your examinations</h2>
    <div id="exam-list"></div>
    <div class="pad"></div>
  </section>

  <!-- Wizard -->
  <section id="s-wizard" hidden>
    <div class="prog" id="prog" aria-hidden="true"></div>
    <div class="kicker" id="kicker"></div>
    <div id="step"></div>
    <p class="err" id="err" role="alert"></p>
    <div class="bar" id="bar">
      <button class="btn ghost" id="btn-back" type="button">Back</button>
      <button class="btn" id="btn-next" type="button">Next</button>
    </div>
  </section>

  <!-- OMR scanner (5 pages) -->
  <section id="s-scan" hidden>
    <div class="prog" id="sc-prog" aria-hidden="true"></div>
    <div class="kicker" id="sc-kicker"></div>
    <div id="sc-step"></div>
    <p class="err" id="sc-err" role="alert"></p>
    <div class="bar" id="sc-bar">
      <button class="btn ghost" id="sc-back" type="button">Back</button>
      <button class="btn" id="sc-next" type="button">Next</button>
    </div>
  </section>

  <!-- Results -->
  <section id="s-result" hidden>
    <button class="linkbtn" id="rs-back" type="button" style="margin-top:18px">← Back to home</button>
    <div id="rs-body"></div>
  </section>

  <footer class="foot">© Anant Shukla (M.Sc. Physics)</footer>
</main>
<div id="vf" hidden>
  <video id="vf-video" autoplay playsinline muted></video>
  <div id="vf-frame"></div>
  <div class="vf-top"><span id="vf-msg">Fit the 4 black corners of the sheet inside the yellow brackets. Keep the top upright.</span><button id="vf-x" type="button" aria-label="Close camera">✕</button></div>
  <div class="vf-bot"><button class="btn ghost" id="vf-dev" type="button">Device camera</button><button class="btn" id="vf-snap" type="button">Snap sheet</button></div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
  const EXAMS_KEY = "optic_x_eval_v5";
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const L = i => String.fromCharCode(65 + i);

  let S, step;
  function freshState() {
    return { cur:0, name:"", m:{ correct:"1", wrong:"0", blank:"0", multi:"0" },
             tpl:{ type:"default", q:20, o:4, c:2 }, key:[],
             groups:[{ id:"class", label:"Class", on:false, items:[] }, { id:"house", label:"House", on:false, items:[] }, { id:"wing", label:"Wing", on:false, items:[] }] };
  }

  /* ---------- storage ---------- */
  let mem = { exams:[], records:{} };
  function loadAll() {
    try { const r = localStorage.getItem(EXAMS_KEY); const s = r ? JSON.parse(r) : null;
      if (s && Array.isArray(s.exams)) return s; } catch (e) { /* ignore */ }
    return mem;
  }
  function saveAll(s) { mem = s; try { localStorage.setItem(EXAMS_KEY, JSON.stringify(s)); return true; } catch (e) { return false; } }
  let tt;
  function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 3000); }

  function renderList() {
    const all = loadAll(), a = all.exams;
    $("exam-list").innerHTML = a.length ? a.slice().reverse().map(e => {
      const mk = e.marking || {};
      return '<div class="ex" data-id="' + esc(e.id) + '"><div><strong>' + esc(e.name) + "</strong><small>" + e.questions + " questions · +" + mk.correct + " / –" + mk.wrong +
        " · " + (((all.records || {})[e.id]) || []).length + " scanned" + ((e.groups || []).length ? "<br>" + esc((e.groups || []).map(g => g.label + "-wise").join(" · ")) : "") + '</small></div><div class="exa"><button class="btn small" data-a="open" type="button">Scan</button>' +
        '<button class="btn ghost small" data-a="result" type="button">Result</button>' +
        '<button class="btn ghost small" data-a="del" type="button">Delete</button></div></div>';
    }).join("") : '<div class="empty">No examinations yet. Create one to get started.</div>';
  }
  $("exam-list").onclick = e => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const id = b.closest(".ex").dataset.id;
    if (b.dataset.a === "open") { startScan(id); return; }
    if (b.dataset.a === "result") { openResult(id); return; }
    if (b.dataset.armed) { const all = loadAll(); all.exams = all.exams.filter(x => x.id !== id); delete (all.records || {})[id]; saveAll(all); renderList(); toast("Examination deleted."); return; }
    b.dataset.armed = "1"; b.textContent = "Tap to confirm";
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Delete"; } }, 3000);
  };

  /* ---------- screens ---------- */
  function showScreen(n) { ["welcome","wizard","scan","result"].forEach(v => { $("s-"+v).hidden = v !== n; }); window.scrollTo(0,0); }
  $("btn-create").onclick = () => { S = freshState(); step = 1; showScreen("wizard"); render(); };
  $("btn-back").onclick = () => { $("err").textContent = ""; if (step === 1) showScreen("welcome"); else { step--; render(); } };
  $("btn-next").onclick = () => {
    const msg = validate(step);
    $("err").textContent = msg || "";
    if (msg) return;
    if (step === 5) return save();
    if (step === 3) fitKey();
    step++; render();
  };

  function render() {
    $("prog").innerHTML = [1,2,3,4,5].map(i =>
      '<div class="dot ' + (i < step ? "done" : i === step ? "now" : "") + '">' + (i < step ? "✓" : i) + "</div>" + (i < 5 ? '<div class="line"></div>' : "")).join("");
    $("kicker").textContent = "Step " + step + " of 5";
    $("btn-next").textContent = step === 5 ? "Save examination" : "Next";
    $("err").textContent = "";
    $("step").onclick = null; $("step").onkeydown = null;
    [null, step1, stepG, step2, step3, step4][step]();
    window.scrollTo(0,0);
  }

  /* ---------- validation ---------- */
  function validate(n) {
    if (n === 1) {
      if (!S.name.trim()) return "Enter an examination name.";
      for (const k in S.m) if (S.m[k].trim() === "" || !isFinite(Number(S.m[k]))) return "Marks must be numbers. Use 0 for no marks.";
    }
    if (n === 2) {
      const g = S.groups.find(x => x.on && !x.items.length);
      if (g) return "Add at least one name for " + g.label + "-wise, or turn it off.";
    }
    if (n === 3 && S.tpl.type === "custom") {
      const q = Number(S.tpl.q);
      if (!Number.isInteger(q) || q < 1 || q > 100) return "Questions must be a whole number from 1 to 100.";
    }
    if (n === 4) {
      const left = S.key.filter(v => v === null || v === undefined).length;
      if (left) return "Set the answer for " + left + " more question" + (left > 1 ? "s" : "") + ".";
    }
    return "";
  }
  function fitKey() {  /* keep key length equal to question count */
    const q = Number(S.tpl.q), k = [];
    for (let i = 0; i < q; i++) k.push(S.key[i] !== undefined && S.key[i] < S.tpl.o ? S.key[i] : null);
    S.key = k;
  }

  /* ---------- step 1: details and marking ---------- */
  function step1() {
    $("step").innerHTML = '<h2>Examination details and marking</h2>' +
      '<div class="card"><label for="f-name">Examination name *</label><input id="f-name" value="' + esc(S.name) + '" maxlength="80" autocomplete="off" />' +
      '<label style="margin-top:20px">Marking scheme (per question)</label><div class="grid2">' +
      field("correct","Correct (+)") + field("wrong","Wrong (–)") + field("blank","Blank") + field("multi","Multi-mark") + '</div>' +
      '<p class="hint">Enter wrong-answer penalty as a positive number. 0 means nothing is deducted.</p></div>';
    $("f-name").oninput = e => { S.name = e.target.value; };
    ["correct","wrong","blank","multi"].forEach(k => { $("m-"+k).oninput = e => { S.m[k] = e.target.value; }; });
  }
  function field(k, label) {
    return '<div><label for="m-' + k + '">' + label + '</label><input id="m-' + k + '" inputmode="decimal" value="' + esc(S.m[k]) + '" /></div>';
  }

  /* ---------- step 2: result groups (class / house / wing / other) ---------- */
  function addItems(g) {
    const el = $("gi-" + g.id); if (!el) return;
    el.value.split(/[,;\n]+/).map(s => s.trim().replace(/\s+/g, " ")).filter(Boolean).forEach(v => { if (!g.items.some(x => x.toLowerCase() === v.toLowerCase())) g.items.push(v); });
    S.focusId = "gi-" + g.id;
  }
  function stepG() {
    const ph = { class:"e.g. 9 A, 9 B, 10 A", house:"e.g. Red, Blue, Green", wing:"e.g. Junior, Senior" };
    const card = g => '<div class="card gcard" data-id="' + esc(g.id) + '"><div class="ghead"><div><b>' + esc(g.label) + '-wise</b><div class="hint" style="margin:0">' +
      (g.on ? "A separate result will be prepared for each " + esc(g.label.toLowerCase()) + "." : "Off") + '</div></div><button class="sw' + (g.on ? " on" : "") + '" type="button" role="switch" aria-checked="' + g.on + '" aria-label="' + esc(g.label) + '-wise" data-act="tog"></button></div>' +
      (g.on ? '<div class="tools" style="margin-top:12px"><input id="gi-' + esc(g.id) + '" placeholder="' + (ph[g.id] || "Names, separated by commas") + '" style="flex:1;min-width:0" autocomplete="off" /><button class="btn small" type="button" data-act="add">Add</button></div>' +
        '<div class="chipbox">' + (g.items.length ? g.items.map((it, i) => '<span class="gchip">' + esc(it) + '<button type="button" data-act="rm" data-i="' + i + '" aria-label="Remove ' + esc(it) + '">✕</button></span>').join("") : '<span class="hint" style="margin:0">Nothing added yet.</span>') + "</div>" : "") +
      (g.custom ? '<button class="linkbtn" type="button" data-act="delg">Remove this grouping</button>' : "") + "</div>";
    $("step").innerHTML = '<h2>Result groups</h2><p class="hint" style="margin-top:0">An overall merit list is always made. Turn on any other way you want results prepared and add the names. You can skip this.</p>' +
      S.groups.map(card).join("") + '<div class="card"><label for="ng">Another grouping (for example Section or Branch)</label><div class="tools"><input id="ng" placeholder="Grouping name" style="flex:1;min-width:0" autocomplete="off" /><button class="btn small" type="button" data-act="newg">Add grouping</button></div></div>';
    $("step").onclick = e => {
      const b = e.target.closest("[data-act]"); if (!b) return;
      const act = b.dataset.act, c = b.closest(".gcard"), g = c && S.groups.find(x => x.id === c.dataset.id);
      if (act === "tog") g.on = !g.on; else if (act === "add") addItems(g); else if (act === "rm") g.items.splice(Number(b.dataset.i), 1);
      else if (act === "delg") S.groups = S.groups.filter(x => x !== g);
      else if (act === "newg") { const v = $("ng").value.trim(); if (!v) return; S.groups.push({ id:"g" + Date.now().toString(36), label:v, on:true, items:[], custom:true }); S.focusId = null; }
      const y = window.scrollY; stepG(); window.scrollTo(0, y);
    };
    $("step").onkeydown = e => {
      if (e.key !== "Enter" || !e.target.id) return;
      if (e.target.id === "ng") { e.preventDefault(); e.target.nextElementSibling.click(); }
      else if (e.target.id.indexOf("gi-") === 0) { e.preventDefault(); const g = S.groups.find(x => "gi-" + x.id === e.target.id); if (g) { addItems(g); stepG(); } }
    };
    if (S.focusId) { const el = $(S.focusId); S.focusId = null; if (el) el.focus(); }
    $("err").textContent = "";
  }

  function rsPdf() {

      const ex = RS.exam, W = 1240, H = 1754, M = 90, RH = 40, F = s => s + 'px "Helvetica Neue", Arial, sans-serif', pages = [], colX = { rank:M, name:M + 100, cls:M + 600, house:M + 800, marks:W - M - 110, pct:W - M };
      let g, y;

      const header = () => { g.font = "bold " + F(22); g.fillStyle = "#111"; g.textAlign = "left"; g.fillText("Rank", colX.rank, y + 26); g.fillText("Student name", colX.name, y + 26); g.fillText("Class & section", colX.cls, y + 26); g.fillText("House", colX.house, y + 26);
        g.textAlign = "right"; g.fillText("Marks", colX.marks, y + 26); g.fillText("%", colX.pct, y + 26); g.textAlign = "left"; g.fillStyle = "#111"; g.fillRect(M, y + 36, W - 2 * M, 2); y += 52; };
      const page = first => { const c = document.createElement("canvas"); c.width = W; c.height = H; g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); pages.push(c); y = M;
        if (first) { g.fillStyle = "#111"; g.font = "bold " + F(42); g.fillText(fit(ex.name, W - 2 * M), M, y + 38); g.fillStyle = "#555"; g.font = F(24);
          g.fillText("Merit list · " + rsViewLabel() + " · " + new Date().toLocaleDateString(), M, y + 80); g.fillText("Marks high to low. Equal marks share a rank and are listed A–Z.", M, y + 112); const ft = rsFilterText(); if (ft) { g.fillText(fit("Filters: " + ft, W - 2 * M), M, y + 144); y += 32; } y += 150; } header(); };
      page(true);
      rsSections().forEach(s => {
        if (RS.view !== "overall") { if (y + 3 * RH + 40 > H - M - 50) page(false); g.fillStyle = "#111"; g.font = "bold " + F(30); g.fillText(s.title + "  (" + s.rows.length + ")", M, y + 30); y += 52; }
        s.rows.forEach((r, i) => {

          if (i % 2) { g.fillStyle = "#f2f4f7"; g.fillRect(M, y - 4, W - 2 * M, RH); }
          g.fillStyle = "#111"; g.font = "bold " + F(24); g.textAlign = "left"; g.fillText(String(r.rank) + (r.tied ? "=" : ""), colX.rank, y + 26);
          g.font = F(24); g.fillText(fit(r.studentName, 480), colX.name, y + 26); g.fillText(fit(r.classSection || "", 190), colX.cls, y + 26); g.fillText(fit(r.house && r.house !== "—" ? r.house : "", 160), colX.house, y + 26);
          g.textAlign = "right"; g.fillText(fmtN(r.score) + " / " + fmtN(r.max), colX.marks + 40, y + 26); g.fillText(pctOf(r.score, r.max) + "", colX.pct, y + 26); g.textAlign = "left"; y += RH;

      rsSave(canvasesToPdf(pages), "pdf"); toast("PDF downloaded.");

  }
